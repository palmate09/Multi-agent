# Development stack: Vite dev server (HMR) + API with live source mounts.
# Production stack (built images, no source mounts) lives in
# deploy/docker-compose.prod.yml.
# Must differ from deploy/docker-compose.prod.yml. Compose identifies a stack
# by project name, so sharing one makes `docker compose up` silently replace the
# production containers: Caddy then proxies to the Vite dev server, which does
# not listen on 8080, and every page returns 502.
name: multi-agent-team-dev

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command:
      - uvicorn
      - app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --reload
    environment:
      ENVIRONMENT: development
      DEBUG: "true"
      RUNS_DIR: /data/runs
      # 1 = skip Ollama entirely. Set 0 with LLM_PROVIDER=local.
      SKIP_OLLAMA: "${SKIP_OLLAMA:-1}"
      # Provider selection: gemini (fast, needs a key) or local (Ollama).
      LLM_PROVIDER: "${LLM_PROVIDER:-gemini}"
      LLM_TIMEOUT: "${LLM_TIMEOUT:-120}"
      GEMINI_MODELS: "${GEMINI_MODELS:-gemini-3-flash-preview,gemini-flash-latest,gemini-3.8-flash}"
      GEMINI_MAX_OUTPUT_TOKENS: "${GEMINI_MAX_OUTPUT_TOKENS:-8192}"
      OLLAMA_MODEL_PM: "${OLLAMA_MODEL_PM:-qwen2.5-coder:3b}"
      OLLAMA_MODEL_DESIGNER: "${OLLAMA_MODEL_DESIGNER:-qwen2.5-coder:7b-instruct-q4_K_M}"
      OLLAMA_MODEL_DEVELOPER: "${OLLAMA_MODEL_DEVELOPER:-qwen2.5-coder:3b}"
      OLLAMA_MODEL_TESTER: "${OLLAMA_MODEL_TESTER:-qwen2.5-coder:3b}"
      OLLAMA_MODEL_REVIEWER: "${OLLAMA_MODEL_REVIEWER:-qwen2.5-coder:3b}"
      # A full app takes minutes at CPU-only qwen throughput; do not lower.
      OLLAMA_TIMEOUT: "${OLLAMA_TIMEOUT:-600}"
      # 1 = never fall back to a hosted key when a local model is available, so a
      # rate-limited key cannot silently change what the run produces.
      PREFER_LOCAL_ONLY: "${PREFER_LOCAL_ONLY:-0}"
      # ---- auth: off by default in dev ----
      # Deliberately NOT read from AUTH_* in the root .env: Compose loads that
      # file automatically, so a production .env generated by
      # deploy/bootstrap-env.sh would otherwise silently switch auth on for the
      # dev stack too. Opt in with the DEV_AUTH_* names instead.
      AUTH_USERNAME: "${DEV_AUTH_USERNAME:-}"
      AUTH_SECRET: "${DEV_AUTH_SECRET:-}"
      AUTH_PASSWORD_HASH: "${DEV_AUTH_PASSWORD_HASH:-}"
      AUTH_API_KEY: "${DEV_AUTH_API_KEY:-}"
      AUTH_COOKIE_SECURE: "${DEV_AUTH_COOKIE_SECURE:-0}"
      OLLAMA_URL: "${OLLAMA_URL:-http://host.docker.internal:11434}"
      CORS_ORIGINS: "http://localhost:5173"
      # CPU inference is slow: two concurrent runs saturate 4 cores.
      MAX_CONCURRENT_RUNS: "${MAX_CONCURRENT_RUNS:-2}"
      RUN_TIMEOUT_SECONDS: "${RUN_TIMEOUT_SECONDS:-1800}"
      SANDBOX_USE_DOCKER: "false"
      GEMINI_API_KEY: "${GEMINI_API_KEY:-}"
      GROQ_API_KEY: "${GROQ_API_KEY:-}"
      OPENROUTER_API_KEY: "${OPENROUTER_API_KEY:-}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - runs-data:/data/runs
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 25s
    restart: unless-stopped

  frontend:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install --no-audit --no-fund && npm run dev -- --host 0.0.0.0"
    environment:
      VITE_BACKEND_URL: http://backend:8000
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend-modules:/app/node_modules
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  runs-data:
  frontend-modules: