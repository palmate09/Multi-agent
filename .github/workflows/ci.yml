name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend lint + tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          # The dev file, not the runtime one: pytest/ruff/bandit are needed
          # here but are deliberately absent from the backend image.
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check app agents graph schemas evals tests

      - name: Format check
        run: ruff format --check app agents graph schemas evals tests

      - name: Tests
        # conftest.py forces SKIP_OLLAMA=1 and PYTHON_DOTENV_DISABLED=1 so the
        # suite never blocks on a model and never reads a stray .env.
        env:
          SKIP_OLLAMA: "1"
        run: pytest -q

      - name: Verify the production compose file is valid
        run: |
          # Catches broken interpolation and missing required-variable guards.
          # Auth enforcement itself is covered by backend/tests/test_auth.py.
          REGISTRY=ghcr.io/example TAG=test \
          AUTH_SECRET=testsecret AUTH_PASSWORD_HASH=scrypt.16384.8.1.salt.digest \
          docker compose -f ../deploy/docker-compose.prod.yml config -q

      - name: Stub pipeline smoke test
        run: python ../cli.py --stub

      - name: Bandit security scan
        run: |
          # B110 (try/except/pass) is deliberate in agents/llm.py: a backend
          # failure must never propagate, it just falls back to template mode.
          # B310 is guarded by _safe_url(), which rejects non-HTTP schemes
          # (see backend/tests/test_llm.py).
          bandit -q -r app agents graph schemas -s B110,B310

  frontend:
    name: Frontend lint, test, typecheck + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      # Unit + component tests, including the jest-axe accessibility
      # assertions. These run in jsdom and need no backend.
      - name: Unit tests
        run: npm run test

      - name: Build
        run: npm run build

  frontend-e2e:
    name: Frontend end-to-end
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      # Playwright drives the REAL FastAPI server (see
      # FRONTEND_IMPROVEMENT_PLAN.md 7.1). No LLM keys are configured, so runs
      # terminate `blocked` deterministically; the finished run the suite
      # reads comes from e2e/fixtures/seed_run.py, not from a model.
      - name: Install backend dependencies
        run: pip install -r ../backend/requirements.txt

      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund

      - name: Seed a finished run
        run: python e2e/fixtures/seed_run.py e2e/fixtures/runs

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run end-to-end tests
        run: npm run test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 7

  images:
    name: Build container images
    runs-on: ubuntu-latest
    needs: [backend, frontend, frontend-e2e]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Build only: proves both Dockerfiles still work. Publishing is the
      # deploy workflow's job.
      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          load: true
          tags: mat-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: false
          load: true
          tags: mat-frontend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test backend image
        run: |
          docker run -d --name ci-backend -e RUNS_DIR=/data/runs \
            -p 8000:8000 mat-backend:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/health > /dev/null; then
              echo "backend healthy"
              docker rm -f ci-backend
              exit 0
            fi
            sleep 2
          done
          echo "backend never became healthy"
          docker logs ci-backend || true
          docker rm -f ci-backend || true
          exit 1