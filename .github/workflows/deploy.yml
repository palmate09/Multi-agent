name: Deploy

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag to deploy"
        required: true
        default: "latest"

# Never let two deploys race for the same VM.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Build and push images to GHCR
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        run: |
          TAG="${{ inputs.tag }}"
          if [ -z "$TAG" ]; then
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Deploying tag: $TAG"

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/multi-agent-backend:${{ steps.meta.outputs.tag }}
            ghcr.io/${{ github.repository_owner }}/multi-agent-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/multi-agent-frontend:${{ steps.meta.outputs.tag }}
            ghcr.io/${{ github.repository_owner }}/multi-agent-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to GCP VM over SSH
    runs-on: ubuntu-latest
    needs: publish
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Configure SSH
        run: |
          install -m 700 -d ~/.ssh
          echo "${{ secrets.VM_SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.VM_HOST }} >> ~/.ssh/known_hosts

      - name: Preflight
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes \
            "${{ secrets.VM_SSH_USER }}@${{ secrets.VM_HOST }}" \
            'docker version >/dev/null && docker compose version >/dev/null && echo "host ready"'

      - name: Deploy and roll
        env:
          REGISTRY: ghcr.io/${{ github.repository_owner }}
          TAG: ${{ needs.publish.outputs.tag }}
          SITE_ADDRESS: ${{ vars.SITE_ADDRESS || ':80' }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Send the compose file and its Caddy config, then pull and roll.
          tar czf /tmp/deploy.tgz deploy/docker-compose.prod.yml deploy/Caddyfile

          ssh -i ~/.ssh/deploy_key "${{ secrets.VM_SSH_USER }}@${{ secrets.VM_HOST }}" \
            'set -e; mkdir -p ~/app/deploy && tar xzf - -C ~/app' < /tmp/deploy.tgz

          ssh -i ~/.ssh/deploy_key "${{ secrets.VM_SSH_USER }}@${{ secrets.VM_HOST }}" \
            'mkdir -p ~/.docker'

          # Login on the host so it can pull from GHCR.
          ssh -i ~/.ssh/deploy_key "${{ secrets.VM_SSH_USER }}@${{ secrets.VM_HOST }}" \
            "echo '$GHCR_TOKEN' | docker login ghcr.io -u '$GHCR_USER' --password-stdin"

          ssh -i ~/.ssh/deploy_key "${{ secrets.VM_SSH_USER }}@${{ secrets.VM_HOST }}" \
            "set -e
             cd ~/app
             printf 'REGISTRY=%s\nTAG=%s\nSITE_ADDRESS=%s\n' '$REGISTRY' '$TAG' '$SITE_ADDRESS' > .env
             docker compose --env-file .env -f deploy/docker-compose.prod.yml pull
             docker compose --env-file .env -f deploy/docker-compose.prod.yml up -d --remove-orphans
             docker image prune -f >/dev/null
             echo 'rolled to $TAG'"

      - name: Health check
        run: |
          for i in $(seq 1 30); do
            if curl -fsS "http://${{ secrets.VM_HOST }}/health" | grep -q '"status":"ok"'; then
              echo "deployment healthy"
              exit 0
            fi
            sleep 4
          done
          echo "health check failed"
          exit 1

      - name: Rollback on failure
        if: failure()
        run: |
          ssh -i ~/.ssh/deploy_key "${{ secrets.VM_SSH_USER }}@${{ secrets.VM_HOST }}" \
            "cd ~/app && docker compose --env-file .env -f deploy/docker-compose.prod.yml \
             down && sed -i 's/^TAG=.*/TAG=latest/' .env \
             && docker compose --env-file .env -f deploy/docker-compose.prod.yml up -d"