[project]
name = "multi-agent-team-backend"
version = "1.0.0"
description = "Multi-agent software team: plain English to a tested, reviewed REST API"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["."]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "I",    # import sorting
    "UP",   # pyupgrade
    "B",    # bugbear
    "SIM",  # simplify
    "C4",   # comprehensions
    "RUF",  # ruff-specific
]

ignore = [
    # FastAPI's dependency-injection idiom is literally Depends(...) in a default.
    "B008",
    # Line length is handled by the formatter, not the linter.
    "E501",
    # `except Exception: pass` is deliberate in the LLM wrapper: a backend
    # failure must never propagate, it just falls back to template mode.
    "BLE001",
    "S110",
]

[tool.ruff.lint.per-file-ignores]
# Agent prompts and template source strings legitimately contain bare
# exception handling and loose typing.
"agents/llm.py" = ["BLE001", "S110", "TRY300"]
"sandbox/runner.py" = ["BLE001", "S110"]
"evals/*" = ["BLE001", "S110"]
"tests/*" = ["BLE001", "S110"]

[tool.ruff.lint.isort]
known-first-party = ["agents", "app", "evals", "graph", "sandbox", "schemas"]

[tool.bandit]
exclude_dirs = ["tests", "sandbox"]