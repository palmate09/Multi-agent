<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#16181b" />
    <meta
      name="description"
      content="Multi-Agent Software Team: plain English to a tested, reviewed full-stack app — REST API plus web UI."
    />
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%2338bdf8'/%3E%3Cpath d='M9 10.5h4a4 4 0 0 1 4 4v1.5M9 21.5h4a4 4 0 0 0 4-4V16M17 16h6' fill='none' stroke='%2304202d' stroke-width='2.2' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E"
    />
    <title>Multi-Agent Software Team</title>
    <!-- Sets the theme before first paint, so someone who prefers light never
         sees a dark flash while the bundle loads. The same rule lives in
         src/lib/theme.ts, which owns the behaviour once the app is running. -->
    <script>
      (function () {
        var theme = 'dark';
        try {
          var saved = localStorage.getItem('mat-theme');
          theme =
            saved === 'light' || saved === 'dark'
              ? saved
              : window.matchMedia('(prefers-color-scheme: light)').matches
                ? 'light'
                : 'dark';
        } catch (e) {}
        document.documentElement.setAttribute('data-theme', theme);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
