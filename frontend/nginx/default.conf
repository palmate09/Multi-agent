server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 2m;

    # Docker's embedded DNS. Resolving the upstream through a variable defers
    # lookup to request time, so nginx starts even when the backend container is
    # not yet up instead of exiting with "host not found in upstream".
    resolver 127.0.0.11 valid=10s ipv6=off;

    # ---- security headers ----
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # ---- health probe for the container HEALTHCHECK ----
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # ---- API + SSE proxied to the backend ----
    location /api/ {
        set $api_upstream http://backend:8000;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Server-sent events: no buffering, no premature timeout.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        chunked_transfer_encoding off;
    }

    location = /health {
        set $health_upstream http://backend:8000/health;
        proxy_pass $health_upstream;
        proxy_set_header Host $host;
        access_log off;
    }

    # ---- live preview of a generated app ----
    # Must come before `location /` (the SPA fallback) or the iframe would get
    # index.html instead of the app. A nested location's add_header REPLACES
    # every server-level header rather than adding to them, so the three
    # security headers are restated here — inheriting the server block's
    # X-Frame-Options "DENY" would refuse to render the preview at all.
    location /preview/ {
        set $preview_upstream http://backend:8000;
        proxy_pass $preview_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Same-origin embedding: the preview iframe lives in our own SPA. DENY
        # (the site-wide value) is the correct setting everywhere else.
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        # The sandboxed app may load its own inline styles/scripts and relative
        # assets. No external origins: the preview host has no network.
        add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'self'" always;

        # Streaming, no buffering: a generated app that streams or takes seconds
        # to answer must not appear frozen.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    # ---- hashed build assets are immutable ----
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ---- SPA fallback ----
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}